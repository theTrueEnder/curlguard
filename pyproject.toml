[project]
name = "curlguard"
dynamic = ["version"]
description = "Secure curl wrapper with YARA scanning - protects against malicious install scripts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yara-python>=4.3.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.50.0",
]
dev = [
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
]

[project.scripts]
curlguard = "curlguard.cli:main"

[project.urls]
Homepage = "https://github.com/theTrueEnder/curlguard"
Repository = "https://github.com/theTrueEnder/curlguard"
Issues = "https://github.com/theTrueEnder/curlguard/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
curlguard = ["rules/*.yar"]

[tool.setuptools.dynamic]
version = {attr = "curlguard.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
