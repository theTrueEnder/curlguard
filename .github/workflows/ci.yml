name: Linux compatibility
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ubuntu: '22.04'
            python: '3.10'
            curl: '7.81.'
          - ubuntu: '24.04'
            python: '3.12'
            curl: '8.5.'
    container: ubuntu:${{ matrix.ubuntu }}
    steps:
      - name: Install distro runtime
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git curl ca-certificates python3 python3-venv build-essential libyara-dev openssl
      - uses: actions/checkout@v4
      - name: Verify matrix versions and install
        run: |
          python3 --version | grep '${{ matrix.python }}'
          curl --version | head -1 | grep '${{ matrix.curl }}'
          python3 -m venv /tmp/test-env
          /tmp/test-env/bin/pip install -e '.[dev]'
      - name: Verify shipped edition
        env:
          EXPECTED_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          /tmp/test-env/bin/python -c 'import os; from curlguard.edition import EDITION; ref=os.environ["EXPECTED_REF"]; assert ref not in ("codex/general-users", "codex/security-users") or ref == "codex/"+EDITION'
      - name: Prepare pinned offline publisher verifier
        run: |
          curl --fail --location --output /tmp/cosign https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  /tmp/cosign' | sha256sum --check
          chmod 700 /tmp/cosign
      - name: Lint and test with real YARA and installed distributions
        env:
          CURLGUARD_TEST_COSIGN: /tmp/cosign
        run: |
          /tmp/test-env/bin/ruff check src tests scripts/validate-wsl-updates.py scripts/install-runtime.py
          /tmp/test-env/bin/ruff format --check src tests scripts/validate-wsl-updates.py scripts/install-runtime.py
          /tmp/test-env/bin/python -c 'import yara; print(yara.__version__)'
          /tmp/test-env/bin/python -m pytest
